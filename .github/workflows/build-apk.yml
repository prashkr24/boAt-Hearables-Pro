name: Build APK

# Builds a signed release APK in the cloud on every push to main
# (or manually from the Actions tab -> Build APK -> Run workflow).
# Download it afterwards from the run page -> Artifacts -> boAt-Hearables-Pro-apk.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: boAt-Hearables-Pro-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
